    <!-- FIGHT NETWORK -->
    <text x="135" y="58" font-family="Arial Black, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" letter-spacing="2">UFC TV</text>
    <text x="135" y="90" font-family="Arial Black, sans-serif" font-weight="900" font-size="22" fill="#D50000" letter-spacing="4">ULTIMATE FIGHTING</text>
  </svg>