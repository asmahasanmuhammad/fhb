<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
    <defs>
      <linearGradient id="fifaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#02569B"/>
        <stop offset="100%" stop-color="#012B4F"/>
      </linearGradient>
    </defs>
    <rect width="400" height="120" rx="16" fill="url(#fifaBlue)"/>
    <!-- FIFA Wordmark -->
