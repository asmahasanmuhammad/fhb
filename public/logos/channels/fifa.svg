    <rect x="290" y="42" width="85" height="36" rx="6" fill="#00E5FF"/>
    <text x="302" y="67" font-family="Arial Black, sans-serif" font-weight="900" font-size="20" fill="#012B4F">OFFICIAL</text>
  </svg>