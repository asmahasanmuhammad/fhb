services:
  fhb:
    build: .
    container_name: football-hub-bangladesh
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./db:/app/db
      - ./public/videos:/app/public/videos
      - ./public/shorts:/app/public/shorts
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/db/custom.db
