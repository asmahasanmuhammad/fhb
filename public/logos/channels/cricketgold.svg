<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
    <defs>
      <linearGradient id="cgGold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFE066"/>
        <stop offset="50%" stop-color="#FFC800"/>
        <stop offset="100%" stop-color="#B38600"/>
      </linearGradient>
    </defs>
    <rect width="400" height="120" rx="16" fill="#14110A"/>
    <!-- Cricket Wickets / Ball Emblem -->
    <circle cx="65" cy="60" r="38" fill="url(#cgGold)"/>
    <circle cx="65" cy="60" r="34" fill="#14110A"/>
    <!-- Crossed Bats / Stumps -->
    <line x1="45" y1="35" x2="85" y2="85" stroke="url(#cgGold)" stroke-width="4"/>
    <line x1="85" y1="35" x2="45" y2="85" stroke="url(#cgGold)" stroke-width="4"/>
    <circle cx="65" cy="60" r="8" fill="#D32F2F"/>
    <!-- Text -->
    <text x="125" y="56" font-family="Arial Black, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="2">CRICKET</text>
    <text x="125" y="92" font-family="Arial Black, sans-serif" font-weight="900" font-size="30" fill="url(#cgGold)" letter-spacing="4">GOLD HD</text>
  </svg>